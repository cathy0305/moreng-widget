name: build-release

# v0.1.0 같은 태그를 푸시하면 맥 + 윈도우 빌드를 동시에 만들어
# 같은 태그의 GitHub Release 에 자동 업로드합니다.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # 깃허브 화면에서 수동 실행도 가능

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14      # Apple Silicon 러너
            build: npm run dist:mac
          - os: windows-latest
            build: npm run dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 의존성 설치
        run: npm ci || npm install

      - name: 빌드
        run: ${{ matrix.build }}

      - name: 릴리스에 업로드
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.dmg
            dist/*.exe
          fail_on_unmatched_files: false
