<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- 원티드 냥이 (SVG 재현본). 공식 원본 PNG가 있으면 이 파일을 교체하세요. -->
  <defs>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f7a9dd"/>
      <stop offset="100%" stop-color="#f7a9dd" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 그림자 -->
  <ellipse cx="80" cy="146" rx="40" ry="7" fill="rgba(26,35,64,.12)"/>

  <!-- 귀 (머리 뒤) -->
  <path d="M40 74 C40 40 44 26 52 26 C64 26 78 46 82 60 Z" fill="#ffffff"/>
  <path d="M120 74 C120 40 116 26 108 26 C96 26 82 46 78 60 Z" fill="#ffffff"/>

  <!-- 머리 -->
  <path d="M80 34
           C112 34 132 56 132 88
           C132 120 110 140 80 140
           C50 140 28 120 28 88
           C28 56 48 34 80 34 Z"
        fill="#ffffff" stroke="#eceef5" stroke-width="1.5"/>

  <!-- 볼터치 -->
  <circle cx="52" cy="103" r="12" fill="url(#cheek)"/>
  <circle cx="108" cy="103" r="12" fill="url(#cheek)"/>

  <!-- 눈 -->
  <g class="eyes">
    <ellipse cx="63" cy="90" rx="6" ry="8.5" fill="#20242e"/>
    <ellipse cx="97" cy="90" rx="6" ry="8.5" fill="#20242e"/>
    <circle cx="65" cy="87" r="1.6" fill="#ffffff"/>
    <circle cx="99" cy="87" r="1.6" fill="#ffffff"/>
  </g>

  <!-- 코 (핑크) -->
  <path d="M80 100
           C86 100 90 103 90 107
           C90 112 84 116 80 116
           C76 116 70 112 70 107
           C70 103 74 100 80 100 Z"
        fill="#f19ad6"/>

  <!-- 입 -->
  <path d="M80 115 C80 120 74 122 71 120" stroke="#e07fc4" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M80 115 C80 120 86 122 89 120" stroke="#e07fc4" stroke-width="2.4" fill="none" stroke-linecap="round"/>
</svg>
